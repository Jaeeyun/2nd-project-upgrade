server {
    listen 80;
    server_name localhost;

    # frontend-test는 CI/CD 파이프라인 자체(OIDC 빌드/푸시/배포)를 증명하는
    # 용도의 격리된 앱이라 정적 콘텐츠만 서빙한다 - 실제 hr-app처럼 employee/hr
    # 백엔드로 proxy_pass하지 않는다. nginx는 proxy_pass 업스트림을 설정 로드
    # 시점에 DNS로 미리 해석하기 때문에(요청 시점이 아님), 존재하지 않는
    # 백엔드를 가리키는 proxy_pass가 있으면 nginx 자체가 기동 실패한다 - 이
    # 앱은 그런 백엔드가 없으므로 아예 두지 않는다.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}
