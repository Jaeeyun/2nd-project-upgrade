server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # /api/employee, /api/hr는 여기서 프록시하지 않는다 - ALB 리스너 규칙
    # (32-mtls-alb.tf)이 host-header+path 조건으로 employee-service/hr-service
    # target group에 직접 분기시킨다. 원래 여기 있던 proxy_pass는
    # employee-service.hr-system.svc.cluster.local처럼 hr-system 네임스페이스를
    # 하드코딩하고 있었는데, 우리는 employee-backend/hr-backend를 쓰므로 그
    # DNS 이름이 존재하지 않아 nginx가 시작 시점에 죽는 문제가 있었다.

    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}
