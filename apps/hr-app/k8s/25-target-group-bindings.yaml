apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: employee-service
  namespace: employee-backend
spec:
  serviceRef:
    name: employee-service
    port: 8000
  targetGroupARN: ${EMPLOYEE_TG_ARN}
  targetType: ip
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: hr-service
  namespace: hr-backend
spec:
  serviceRef:
    name: hr-service
    port: 8000
  targetGroupARN: ${HR_TG_ARN}
  targetType: ip
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: frontend
  namespace: frontend
spec:
  serviceRef:
    name: frontend
    port: 80
  targetGroupARN: ${FRONTEND_TG_ARN}
  targetType: ip
